<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Life Left</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="grid"></div>

<div class="overlay">
  <h1>Life left...</h1>

  <div class="timer">
    <div class="box">
      <span id="years">00</span>
      <label>YEARS</label>
    </div>

    <div class="box">
      <span id="months">00</span>
      <label>MONTHS</label>
    </div>

    <div class="box">
      <span id="days">00</span>
      <label>DAYS</label>
    </div>

    <div class="box">
      <span id="hours">00</span>
      <label>HOURS</label>
    </div>

    <div class="box">
      <span id="minutes">00</span>
      <label>MINUTES</label>
    </div>

    <div class="box">
      <span id="seconds">00</span>
      <label>SECONDS</label>
    </div>

    <div class="box">
        <span id="ms">00</span>
        <label>MS</label>
    </div>


  </div>

    

</div>

<script src="script.js"></script>
</body>
</html>
